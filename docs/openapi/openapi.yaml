openapi: 3.0.3
info:
  title: GeoDesk GIS API
  version: "1.0.0"
  description: >
    Газарзүйн солбилцолтой өгөгдөл унших, нэгтгэх, онлайн газрын зургаас
    татах, рельефийн шинжилгээ (хаялбар, гольдрол) хийх, форматаар
    хөрвүүлэх API. Бүх хүсэлт `Authorization: Bearer <JWT>` толгойтой
    байх ёстой. Sandbox сервер нь энэ spec доторх жишээ хариуг буцаадаг
    mock тул "Try it out"-ыг бодит өгөгдөлгүйгээр турших боломжтой.
  contact:
    name: С.Сумъяабазар (21B1NUM0119)
    email: 21b1num0119@stud.num.edu.mn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.geodesk.mn/v1
    description: Production server
  - url: ./mock/geodesk/v1
    description: Sandbox mock (GitHub Pages, spec-ийн жишээ хариуг буцаана)

security:
  - BearerAuth: []

tags:
  - name: Layers
    description: Давхарга импорт ба формат хөрвүүлэлт (arc42 B1)
  - name: Projects
    description: Давхарга ба төслийн менежер (arc42 B3)
  - name: WMS
    description: Онлайн газрын зургийн клиент (arc42 B4)
  - name: Terrain
    description: Рельефийн шинжилгээ (arc42 B5)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GeoDesk dashboard-оос авсан JWT токен.

  schemas:
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          example: "INVALID_GEOMETRY"
        message:
          type: string
          example: "Uploaded shapefile contains an unclosed polygon ring."

    Layer:
      type: object
      required: [layer_id, name, geometry_type, format]
      properties:
        layer_id:
          type: string
          example: "layer_7f3a21"
        name:
          type: string
          example: "sukhbaatar_parking_boundary"
        geometry_type:
          type: string
          enum: [point, line, polygon, raster]
          example: "polygon"
        format:
          type: string
          enum: [shapefile, geojson, kml, geotiff]
          example: "geojson"
        crs:
          type: string
          example: "EPSG:4326"

    MergeResult:
      type: object
      required: [project_id, merged_layer_count]
      properties:
        project_id:
          type: string
          example: "proj_main_road"
        merged_layer_count:
          type: integer
          example: 2
        target_crs:
          type: string
          example: "EPSG:32648"

    ContourResult:
      type: object
      required: [job_id, status, interval_m]
      properties:
        job_id:
          type: string
          example: "contour_job_55de"
        status:
          type: string
          enum: [queued, processing, done, failed]
          example: "done"
        interval_m:
          type: number
          example: 1.0
        output_layer_id:
          type: string
          example: "layer_contour_9a21"

    WatershedResult:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          example: "watershed_job_19b7"
        status:
          type: string
          enum: [queued, processing, done, failed]
          example: "done"
        stream_layer_id:
          type: string
          example: "layer_streams_3c08"
        basin_layer_id:
          type: string
          example: "layer_basin_3c09"
        basin_area_km2:
          type: number
          example: 12.4

  responses:
    Unauthorized:
      description: JWT токен байхгүй эсвэл хугацаа нь дууссан
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: "UNAUTHORIZED"
            message: "Missing or expired Bearer token."
    InternalError:
      description: Серверийн дотоод алдаа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error_code: "INTERNAL_ERROR"
            message: "Geo Processing Engine stopped unexpectedly; retry later."

paths:
  /layers/import:
    post:
      operationId: importLayer
      tags: [Layers]
      summary: Вектор/растер өгөгдлийн файл импорт хийх (FR-01, FR-08)
      description: >
        Shapefile (.zip), GeoJSON, KML (вектор) эсвэл GeoTIFF/DEM (растер)
        файлыг серверт байршуулж, шинэ давхарга болгон бүртгэнэ.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: Shapefile (.zip), GeoJSON, KML, эсвэл GeoTIFF файл
                name:
                  type: string
                  example: "sukhbaatar_parking_boundary"
            examples:
              geojsonUpload:
                summary: Сүхбаатарын талбайн зогсоолын хил (GeoJSON)
                value:
                  file: "sukhbaatar_parking_boundary.geojson"
                  name: "sukhbaatar_parking_boundary"
      responses:
        "200":
          description: Амжилттай импорт хийгдэв
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layer"
              examples:
                importedLayer:
                  summary: Импортлогдсон полигон давхарга
                  value:
                    layer_id: "layer_7f3a21"
                    name: "sukhbaatar_parking_boundary"
                    geometry_type: "polygon"
                    format: "geojson"
                    crs: "EPSG:4326"
        "400":
          description: Буруу формат эсвэл эвдэрсэн геометр
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "INVALID_GEOMETRY"
                message: "Uploaded shapefile contains an unclosed polygon ring."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Сүхбаатарын талбайн зогсоолын хилийг GeoJSON файлаас импортлоно
            with open("samples/sukhbaatar_parking_boundary.geojson", "rb") as boundary_file:
                import_response = requests.post(
                    f"{BASE_URL}/layers/import",
                    headers=auth_header,
                    files={"file": ("sukhbaatar_parking_boundary.geojson", boundary_file, "application/geo+json")},
                    data={"name": "sukhbaatar_parking_boundary"},
                )

            import_response.raise_for_status()
            imported_layer = import_response.json()
            print(imported_layer["layer_id"])  # layer_7f3a21

  /projects/{project_id}/layers/merge:
    post:
      operationId: mergeLayers
      tags: [Projects]
      summary: Олон давхаргыг нэг төсөл болгон нэгтгэх (FR-04, FR-05)
      description: >
        Заасан давхаргуудыг нэг төсөлд нэгтгэж, шаардлагатай бол нэг
        координатын системд (target_crs) дахин проекцлоно.
      parameters:
        - name: project_id
          in: path
          required: true
          description: Нэгтгэл хийх төслийн ID
          schema:
            type: string
          example: "proj_main_road"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layer_ids]
              properties:
                layer_ids:
                  type: array
                  minItems: 2
                  items:
                    type: string
                target_crs:
                  type: string
                  description: Нэгтгэсэн үр дүнгийн координатын систем
            examples:
              mergeBoundaryAndContours:
                summary: Зогсоолын хил ба хаялбарын давхаргыг нэгтгэх
                value:
                  layer_ids: ["layer_7f3a21", "layer_contour_9a21"]
                  target_crs: "EPSG:32648"
      responses:
        "200":
          description: Давхаргууд амжилттай нэгтгэгдэв
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResult"
              examples:
                merged:
                  summary: 2 давхарга нэгтгэгдсэн
                  value:
                    project_id: "proj_main_road"
                    merged_layer_count: 2
                    target_crs: "EPSG:32648"
        "400":
          description: layer_ids дор хаяж 2 элементтэй байх ёстой
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "NOT_ENOUGH_LAYERS"
                message: "layer_ids must contain at least 2 layer IDs."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Төсөл эсвэл давхарга олдсонгүй
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "LAYER_NOT_FOUND"
                message: "layer_id 'layer_contour_9a21' does not exist in this project."
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Зогсоолын хил ба 1м хаялбарын давхаргыг UTM 48N проекцоор нэгтгэнэ
            merge_response = requests.post(
                f"{BASE_URL}/projects/proj_main_road/layers/merge",
                headers=auth_header,
                json={"layer_ids": ["layer_7f3a21", "layer_contour_9a21"], "target_crs": "EPSG:32648"},
            )

            merge_response.raise_for_status()
            print(merge_response.json()["merged_layer_count"])  # 2

  /wms/layers:
    get:
      operationId: listWMSLayers
      tags: [WMS]
      summary: Онлайн WMS/WMTS үйлчилгээнээс боломжтой давхаргуудыг жагсаах (FR-06)
      description: >
        GET хүсэлт тул requestBody байхгүй (RFC 9110); хүсэлтийн жишээг
        `bbox` query параметрийн жишээгээр өгсөн.
      parameters:
        - name: bbox
          in: query
          required: true
          description: "minLon,minLat,maxLon,maxLat (WGS84)"
          schema:
            type: string
          examples:
            ulaanbaatarCenter:
              summary: Улаанбаатар хотын төв
              value: "106.8,47.9,106.95,47.95"
      responses:
        "200":
          description: Боломжтой давхаргын жагсаалт
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layer"
              examples:
                satelliteBasemap:
                  summary: Хиймэл дагуулын суурь зураг
                  value:
                    - layer_id: "wms_satellite_2026"
                      name: "Satellite Basemap 2026"
                      geometry_type: "raster"
                      format: "geotiff"
                      crs: "EPSG:3857"
        "400":
          description: bbox параметр буруу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "INVALID_BBOX"
                message: "bbox must contain exactly 4 comma-separated numbers."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Гадаад WMS үйлчилгээ хариу өгсөнгүй
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "WMS_UNAVAILABLE"
                message: "Upstream WMS server timed out after 5s."
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Улаанбаатар хотын төвийг хамарсан WMS давхаргуудыг жагсаана
            wms_response = requests.get(
                f"{BASE_URL}/wms/layers",
                headers=auth_header,
                params={"bbox": "106.8,47.9,106.95,47.95"},
            )

            wms_response.raise_for_status()
            for wms_layer in wms_response.json():
                print(wms_layer["layer_id"], wms_layer["crs"])  # wms_satellite_2026 EPSG:3857

  /terrain/contours:
    post:
      operationId: computeContours
      tags: [Terrain]
      summary: DEM өгөгдлөөс хаялбарын шугам тооцоолох (FR-09)
      description: >
        50MB хүртэлх DEM файлыг 8 секундын дотор боловсруулж, заасан
        интервалтай хаялбарын шугам үүсгэнэ (±0.5м нарийвчлал). 200MB-аас
        том DEM-ийг 413 кодоор татгалзана.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dem_layer_id, interval_m]
              properties:
                dem_layer_id:
                  type: string
                interval_m:
                  type: number
                  minimum: 0.5
            examples:
              oneMeterContours:
                summary: 1 метрийн интервалтай хаялбар
                value:
                  dem_layer_id: "layer_dem_44c1"
                  interval_m: 1.0
      responses:
        "200":
          description: Тооцоолол амжилттай дуусав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContourResult"
              examples:
                contoursDone:
                  summary: Хаялбарын давхарга үүссэн
                  value:
                    job_id: "contour_job_55de"
                    status: "done"
                    interval_m: 1.0
                    output_layer_id: "layer_contour_9a21"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: DEM файл хэт том (>200MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "PAYLOAD_TOO_LARGE"
                message: "DEM file exceeds 200MB limit; request rejected."
        "422":
          description: DEM дутуу өгөгдөлтэй (NoData)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "INVALID_DEM"
                message: "DEM contains NoData cells covering 40% of extent."
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Импортлосон DEM давхаргаас 1 метрийн интервалтай хаялбар үүсгэнэ
            contour_response = requests.post(
                f"{BASE_URL}/terrain/contours",
                headers=auth_header,
                json={"dem_layer_id": "layer_dem_44c1", "interval_m": 1.0},
            )

            contour_response.raise_for_status()
            contour_job = contour_response.json()
            print(contour_job["status"], contour_job["output_layer_id"])  # done layer_contour_9a21

  /terrain/watershed:
    post:
      operationId: computeWatershed
      tags: [Terrain]
      summary: DEM-ээс усны урсгал, гольдрол ба сав газар тодорхойлох (FR-10, FR-11)
      description: >
        Урсгалын чиглэлийг (D8) тооцож, `min_flow_accumulation`-аас их
        хуримтлалтай нүднүүдийг гольдрол болгон, гаргалгааны цэгийн сав
        газрыг полигон давхарга болгон буцаана.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dem_layer_id, pour_point]
              properties:
                dem_layer_id:
                  type: string
                pour_point:
                  type: array
                  description: Гаргалгааны цэг [lon, lat]
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
                min_flow_accumulation:
                  type: integer
                  default: 500
            examples:
              tuulRiverBasin:
                summary: Туул голын дэд сав газар
                value:
                  dem_layer_id: "layer_dem_44c1"
                  pour_point: [106.9172, 47.8864]
                  min_flow_accumulation: 500
      responses:
        "200":
          description: Гольдрол ба сав газар амжилттай тооцоологдов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatershedResult"
              examples:
                watershedDone:
                  summary: Гольдрол ба сав газрын давхаргууд
                  value:
                    job_id: "watershed_job_19b7"
                    status: "done"
                    stream_layer_id: "layer_streams_3c08"
                    basin_layer_id: "layer_basin_3c09"
                    basin_area_km2: 12.4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Гаргалгааны цэг DEM-ийн хамрах хүрээнээс гадуур
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "POUR_POINT_OUTSIDE_DEM"
                message: "pour_point [106.9172, 47.8864] lies outside layer_dem_44c1 extent."
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Туул голын гаргалгааны цэгээс дээш орших сав газрыг тодорхойлно
            watershed_response = requests.post(
                f"{BASE_URL}/terrain/watershed",
                headers=auth_header,
                json={"dem_layer_id": "layer_dem_44c1", "pour_point": [106.9172, 47.8864]},
            )

            watershed_response.raise_for_status()
            print(watershed_response.json()["basin_area_km2"])  # 12.4

  /layers/{layer_id}/convert:
    post:
      operationId: convertLayer
      tags: [Layers]
      summary: Давхаргыг өөр форматад хөрвүүлэх (FR-12, FR-13)
      parameters:
        - name: layer_id
          in: path
          required: true
          description: Хөрвүүлэх давхаргын ID
          schema:
            type: string
          example: "layer_7f3a21"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_format]
              properties:
                target_format:
                  type: string
                  enum: [shapefile, geojson, kml, geotiff]
            examples:
              toKml:
                summary: GeoJSON давхаргыг KML болгох
                value:
                  target_format: "kml"
      responses:
        "200":
          description: Хөрвүүлэлт амжилттай
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layer"
              examples:
                convertedLayer:
                  summary: KML болгон хөрвүүлсэн давхарга
                  value:
                    layer_id: "layer_7f3a21_kml"
                    name: "sukhbaatar_parking_boundary"
                    geometry_type: "polygon"
                    format: "kml"
                    crs: "EPSG:4326"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Давхарга олдсонгүй
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "LAYER_NOT_FOUND"
                message: "layer_id 'layer_7f3a21' does not exist."
        "415":
          description: Дэмжигдэхгүй формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error_code: "UNSUPPORTED_FORMAT"
                message: "target_format 'dwg' is not supported."
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: Python
          label: Python (requests)
          source: |
            import os
            import requests

            BASE_URL = "https://api.geodesk.mn/v1"
            auth_header = {"Authorization": f"Bearer {os.environ['GEODESK_API_TOKEN']}"}

            # Зогсоолын хилийн давхаргыг Google Earth-д нээх KML болгоно
            convert_response = requests.post(
                f"{BASE_URL}/layers/layer_7f3a21/convert",
                headers=auth_header,
                json={"target_format": "kml"},
            )

            convert_response.raise_for_status()
            print(convert_response.json()["format"])  # kml
